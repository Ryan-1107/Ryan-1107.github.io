        /* ==========================
           主要內容
        ========================== */

        .container {

            max-width: 1100px;

            margin: 40px auto;
        }


        /* ==========================
           返回按鈕
        ========================== */

        .back-btn {
            display: inline-block;

            margin-bottom: 20px;

            color: #607d6d;

            text-decoration: none;

            font-size: 15px;
        }

        .back-btn:hover {
            text-decoration: underline;
        }


        /* ==========================
           標題
        ========================== */

        .page-title {
            margin: 0;

            color: #40544b;

            font-size: 30px;
        }


        /* 日期 */

        .date {
            margin-top: 8px;

            margin-bottom: 35px;

            color: #7c9889;

            font-size: 18px;

            font-weight: bold;
        }


        /* ==========================
           科目區塊
        ========================== */

        .subject-section {
            margin-bottom: 35px;
        }


        /* 科目標題 */

        .subject-title {
            margin-bottom: 15px;

            padding-left: 12px;

            border-left: 5px solid #607d6d;

            color: #40544b;

            font-size: 22px;

            font-weight: bold;
        }


        /* ==========================
           表格
        ========================== */

        .table-wrapper {
            overflow-x: auto;

            background-color: white;

            border-radius: 14px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.06);
        }


        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 600px;
        }


        /* 表頭 */

        th {
            padding: 15px;

            background-color: #eef3f0;

            color: #40544b;

            text-align: left;

            font-size: 14px;
        }


        /* 表格內容 */

        td {
            padding: 15px;

            border-bottom:
                1px solid #edf0ee;

            font-size: 14px;
        }


        tr:last-child td {
            border-bottom: none;
        }


        /* ==========================
           大學伴姓名
        ========================== */

        .student-name {
            color: #40544b;

            font-weight: bold;
        }


        /* ==========================
           下拉選單
        ========================== */

        select {
            padding: 9px 12px;

            border:
                1px solid #d5dcd8;

            border-radius: 8px;

            background-color: #fafcfb;

            color: #333;

            font-size: 14px;

            cursor: pointer;

            outline: none;
        }


        select:focus {
            border-color: #7c9889;

            box-shadow:
                0 0 0 3px
                rgba(124, 152, 137, 0.12);
        }


        /* ==========================
           儲存區域
        ========================== */

        .save-area {
            margin-top: 30px;

            text-align: right;
        }


        /* 儲存按鈕 */

        .save-btn {
            padding: 13px 30px;

            border: none;

            border-radius: 9px;

            background-color: #607d6d;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .save-btn:hover {
            background-color: #4f695b;
        }


        .save-btn:active {
            transform: scale(0.98);
        }


        /* ==========================
           手機版
        ========================== */

        @media (max-width: 700px) {

            .container {
                width: 92%;

                margin: 30px auto;
            }

            .page-title {
                font-size: 25px;
            }

        }
    </style>

    <script>


        /* ==========================
           取得網址中的日期
        ========================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const date =
            params.get("date");


        if (date) {

            document.getElementById(
                "lessonDate"
            ).textContent =
                date.replaceAll("-", "/");

        } else {

            document.getElementById(
                "lessonDate"
            ).textContent =
                "未指定日期";

        }



        /* ==========================
           儲存評分
        ========================== */

        function saveData() {

            alert(
